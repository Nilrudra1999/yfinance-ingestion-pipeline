name: Remote ETL Processing

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated ticker list'
        required: true
        default: 'AAPL,SPY'

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Tickers File
        run: |
          echo "${{ github.event.inputs.tickers }}" > tickers.txt

      - name: Run Remote Pipeline Execution
        run: |
          python main.py --mode remote-extract

      - name: Upload Extracted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: transformed-etl-data
          path: transformed_data.json
          retention-days: 1
          